<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-main.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Phase 6.2 — critical-path resource hints.
         The favicon is referenced above AND preloaded so the tab icon paints with the
         first byte instead of after the CSS is parsed. logo-main is the PWA icon used
         by the nav bar on every screen. -->
    <link rel="preload" href="/favicon.png" as="image" type="image/png" />
    <link rel="preload" href="/logo-main.png" as="image" type="image/png" />

    <!-- Early connections to the AI providers BYOK mode can reach directly from the
         browser, so the first chat/scan call does not pay for DNS + TLS. -->
    <link rel="dns-prefetch" href="https://openrouter.ai" />
    <link rel="dns-prefetch" href="https://integrate.api.nvidia.com" />
    <link rel="dns-prefetch" href="https://api.anthropic.com" />
    <link rel="dns-prefetch" href="https://api.openai.com" />
    <link rel="dns-prefetch" href="https://api.mistral.ai" />
    <link rel="dns-prefetch" href="https://api.groq.com" />
    <link rel="dns-prefetch" href="https://api.together.xyz" />

    <title>Libriwouô</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the hashed bundle + CSS here at build time. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
